; Demeter controller firmware for the Adafruit ESP32 Feather V2.
; https://github.com/AJFrio/Demeter

[platformio]
default_envs = featheresp32v2

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

[env:featheresp32v2]
platform = espressif32@6.9.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
build_src_filter = -<*>
lib_deps =
    ${env.lib_deps}
